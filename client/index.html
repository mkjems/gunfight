<!doctype html>
<html>
    <head>
        <title>Gunfight</title>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#1e1e1e" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Gunfight" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <link
            rel="stylesheet"
            href="/css/index.css"
            type="text/css"
            media="screen"
        />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/favicon.ico?v=gunfight-v1" />
        <link
            rel="shortcut icon"
            type="image/x-icon"
            href="/favicon.ico?v=gunfight-v1"
        />
    </head>

    <body>
        <div id="rotatePrompt">
            <img
                src="/images/RotatePlease.png"
                alt="Rotate your device to landscape"
            />
        </div>
        <div id="installPrompt" hidden>
            <button
                type="button"
                id="installPromptClose"
                aria-label="Dismiss install instructions"
            >
                X
            </button>
            <div>FULL SCREEN MODE</div>
            <div id="installPromptText">SHARE - ADD TO HOME SCREEN</div>
            <button type="button" id="installPromptButton" hidden>
                INSTALL
            </button>
        </div>
        <div id="gameStage">
            <canvas id="canvas"></canvas>
            <canvas id="hudCanvas"></canvas>
            <div id="hudOverlay" aria-live="polite">
                <div id="gameHud" hidden></div>
                <div id="lobbyHud" hidden>
                    <div id="lobby-main"></div>
                    <div id="highScoresScreen" hidden>
                        <h1>HIGH SCORES</h1>
                        <div id="highScoresTable"></div>
                        <div id="highScoresPlayPrompt" class="blink-text"></div>
                    </div>
                    <div id="nameEditor" hidden></div>
                    <div id="touchLobbyControls" hidden></div>
                </div>
            </div>
            <div id="touchControls" hidden></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
